[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tu-web-linguacheck"
version = "0.1.0"
description = "Lokale Sprachprüfung für öffentlich erreichbare Websites"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Dr. Harald Hutter" },
]
dependencies = [
  "beautifulsoup4>=4.12",
  "lingua-language-detector==2.2.0",
  "spacy==3.8.16",
  "de_core_news_lg @ https://github.com/explosion/spacy-models/releases/download/de_core_news_lg-3.8.0/de_core_news_lg-3.8.0-py3-none-any.whl",
  "markdown-it-py>=4.0",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "weasyprint>=66.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pylint>=3.0",
  "pytest>=8.0",
  "ruff>=0.6",
  "xenon>=0.9",
  "pymarkdownlnt>=0.9",
]

[project.scripts]
tu-web-linguacheck = "tu_web_linguacheck.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
