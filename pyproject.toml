[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tu-web-linguacheck"
version = "0.1.0"
description = "Lokale Sprachprüfung für öffentlich erreichbare Websites"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Dr. Harald Hutter" },
]
dependencies = [
  "beautifulsoup4>=4.12",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
tu-web-linguacheck = "tu_web_linguacheck.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
